```html
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar participantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Gerenciar participantes</h1>
            <p th:text="${evento.titulo}"></p>
        </div>

        <a href="/admin" class="btn btn-secondary">
            Voltar ao painel
        </a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success"
         th:text="${sucesso}"></div>

    <div th:if="${erro}" class="alert alert-danger"
         th:text="${erro}"></div>

    <div class="card">
        <div class="card-body">

            <p>
                <strong>Total de inscritos:</strong>
                <span th:text="${#lists.size(inscricoes)}"></span>
            </p>

            <p>
                <strong>Vagas disponíveis:</strong>
                <span th:text="${evento.vagasDisponiveis}"></span>
            </p>

            <div class="table-responsive">
                <table class="table table-striped align-middle">

                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Data da inscrição</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="inscricao : ${inscricoes}">

                        <td colspan="3">
                            <form th:id="|editar-${inscricao.id}|"
                                  th:action="@{/admin/inscricoes/{id}/editar(id=${inscricao.id})}"
                                  method="post"
                                  class="row g-2">

                                <div class="col-md-4">
                                    <input type="text"
                                           name="nomeParticipante"
                                           class="form-control"
                                           th:value="${inscricao.nomeParticipante}"
                                           required>
                                </div>

                                <div class="col-md-4">
                                    <input type="email"
                                           name="email"
                                           class="form-control"
                                           th:value="${inscricao.email}"
                                           required>
                                </div>

                                <div class="col-md-4">
                                    <span th:text="${#temporals.format(inscricao.dataInscricao, 'dd/MM/yyyy HH:mm')}"></span>
                                </div>

                            </form>
                        </td>

                        <td class="text-nowrap">

                            <button type="submit"
                                    th:form="|editar-${inscricao.id}|"
                                    class="btn btn-primary btn-sm">
                                Salvar
                            </button>

                            <form th:action="@{/admin/inscricoes/{id}/excluir(id=${inscricao.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Deseja realmente remover este participante?');">

                                <button type="submit"
                                        class="btn btn-danger btn-sm">
                                    Remover
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(inscricoes)}">
                        <td colspan="4" class="text-center">
                            Nenhum participante inscrito.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
```
