<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">

    <div class="d-flex justify-content-between mb-4">
        <h1>Painel administrativo</h1>

        <div>
            <a href="/admin/novo" class="btn btn-success">
                + Novo evento
            </a>
            <a href="/admin/logout" class="btn btn-outline-secondary">
                Sair
            </a>
        </div>
    </div>

    <div th:if="${sucesso}" class="alert alert-success"
         th:text="${sucesso}"></div>

    <div th:if="${erro}" class="alert alert-danger"
         th:text="${erro}"></div>

    <table class="table table-striped bg-white">
        <thead>
        <tr>
            <th>Evento</th>
            <th>Data</th>
            <th>Inscritos</th>
            <th>Vagas disponíveis</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="evento : ${eventos}">
            <td th:text="${evento.titulo}"></td>

            <td th:text="${#temporals.format(
                evento.dataEvento, 'dd/MM/yyyy HH:mm')}"></td>

            <td th:text="${evento.vagasTotais -
                evento.vagasDisponiveis}"></td>

            <td th:text="${evento.vagasDisponiveis}"></td>

            <td>
                <a th:href="@{/admin/inscricoes/{id}(id=${evento.id})}"
                   class="btn btn-sm btn-primary">
                    Participantes
                </a>

                <a th:href="@{/admin/editar/{id}(id=${evento.id})}"
                   class="btn btn-sm btn-warning">
                    Editar
                </a>

                <a th:href="@{/admin/deletar/{id}(id=${evento.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Deseja excluir este evento?')">
                    Excluir
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/">Voltar à página pública</a>
</div>
</body>
</html>
