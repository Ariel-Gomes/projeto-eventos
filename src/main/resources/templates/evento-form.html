<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${tituloPagina}">Cadastro de Evento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5" style="max-width: 760px;">

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h1 class="h3 mb-4" th:text="${tituloPagina}">
                Cadastrar novo evento
            </h1>

            <form th:action="@{/admin/salvar}"
                  th:object="${evento}"
                  method="post">

                <!-- Identifica o evento durante a edição -->
                <input type="hidden" th:field="*{id}">

                <!-- Título -->
                <div class="mb-3">
                    <label for="titulo" class="form-label">
                        Título do evento
                    </label>

                    <input id="titulo"
                           type="text"
                           class="form-control"
                           th:field="*{titulo}"
                           maxlength="150"
                           required>
                </div>

                <!-- Data e horário -->
                <div class="mb-3">
                    <label for="dataEvento" class="form-label">
                        Data e horário
                    </label>

                    <input id="dataEvento"
                           type="datetime-local"
                           class="form-control"
                           th:field="*{dataEvento}"
                           required>
                </div>

                <!-- Quantidade de vagas -->
                <div class="mb-3">
                    <label for="vagasTotais" class="form-label">
                        Quantidade total de vagas
                    </label>

                    <input id="vagasTotais"
                           type="number"
                           class="form-control"
                           th:field="*{vagasTotais}"
                           min="1"
                           step="1"
                           required>

                    <div class="form-text"
                         th:if="${evento.id != null}">
                        As inscrições já realizadas serão preservadas.
                    </div>
                </div>

                <!-- Botões -->
                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary">
                        Salvar evento
                    </button>

                    <a th:href="@{/}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
